<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ساعة فاخرة - أكادير</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      font-size: 18px;
      margin-top: 12px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      text-align: center;
    }

    .product img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 28px;
      margin: 10px 0;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      color: #c58b20;
      margin: 15px 0;
    }

    .info {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .order {
      display: block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    .call {
      display: block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>⌚ ساعة فاخرة</h1>
    <p>أناقة وجودة بسعر مناسب</p>
  </header>

  <div class="container">

    <div class="product">

      <img src="IMG_20260927_212905.jpg" alt="ساعة فاخرة">

      <img src="IMG_20260927_212741.jpg" alt="ساعة فاخرة">

      <h2>ساعة فاخرة وأنيقة</h2>

      <div class="price">
        150 درهم
      </div>

      <div class="info">
        📍 التوصيل داخل أكادير<br>
        🚚 اطلب الآن وسنقوم بالتواصل معك
      </div>

      <a class="order"
         href="https://wa.me/212783084921?text=السلام%20عليكم،%20أريد%20طلب%20الساعة%20بسعر%20150%20درهم">
        🛒 اطلب عبر واتساب
      </a>

      <a class="call" href="tel:0783084921">
        📞 اتصل الآن: 0783084921
      </a>

    </div>

  </div>

  <footer>
    © 2026 ساعة فاخرة - أكادير
  </footer>

</body>
</html>
